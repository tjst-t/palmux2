<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>S62374c · Browser タブ — stopped</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="appShell" data-testid="browser-tab-panel">
    <header class="appHeader">
      <span class="brand">◐ palmux2</span>
      <span class="crumb">tjst-t/palmux2 · <b>feature-browser</b></span>
      <span class="spacer"></span>
      <span class="runtimeChip" title="runtime: incus-container"><span class="dot"></span> incus-container</span>
      <button class="iconBtn" title="Activity Inbox">🔔</button>
    </header>

    <nav class="tabBar">
      <button class="tab"><span>✦</span> Claude</button>
      <button class="tab"><span>🗂</span> Files</button>
      <button class="tab"><span>⎇</span> Git</button>
      <button class="tab"><span>🔌</span> Ports</button>
      <button class="tab" aria-selected="true"><span class="tdot"></span> Browser</button>
    </nav>

    <section class="browserPanel">
      <!-- control bar present but inert while stopped; badge shows stopped -->
      <div class="browserBar">
        <div class="navBtns">
          <button class="navBtn" data-testid="browser-back" disabled style="opacity:.4">◀</button>
          <button class="navBtn" data-testid="browser-forward" disabled style="opacity:.4">▶</button>
          <button class="navBtn" data-testid="browser-reload" disabled style="opacity:.4">⟳</button>
        </div>
        <input class="urlInput" data-testid="browser-url-input" placeholder="ブラウザ停止中 — Start すると操作できます" disabled>
        <span class="stateBadge stopped" data-testid="browser-state-badge"><span class="bdot"></span> stopped</span>
      </div>

      <div class="browserCenter" data-testid="browser-stopped">
        <div class="stateCard">
          <div class="glyph">🌐</div>
          <h2>ブラウザは停止中</h2>
          <p>この Workspace 専用の共有ブラウザです。起動すると、<b style="color:var(--color-fg)">Claude と同じ画面</b>をリアルタイムで観察でき、必要なときに自分でも操作できます。</p>
          <button class="startBtnLg" data-testid="browser-start">▶ ブラウザを起動</button>
          <p class="subnote">Claude も <code>palmux-browser start</code> で起動できます（起動は Activity Inbox に表示）。Workspace を開いただけでは起動しません。</p>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
