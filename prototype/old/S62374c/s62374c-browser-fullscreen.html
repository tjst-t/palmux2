<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Browser · feature-browser — palmux2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- standalone full-window view (opened via ↗ Open). Same shared browser, no palmux tab/drawer chrome. -->
  <div class="appShell" data-testid="browser-fullscreen">

    <header class="popHeader">
      <span class="brand">◐ palmux2 · Browser</span>
      <span class="crumb">tjst-t/palmux2 · feature-browser · <span style="color:var(--color-accent-light)">incus-container</span></span>
    </header>

    <section class="browserPanel">
      <div class="browserBar">
        <div class="navBtns">
          <button class="navBtn" data-testid="browser-back" title="戻る">◀</button>
          <button class="navBtn" data-testid="browser-forward" title="進む">▶</button>
          <button class="navBtn" data-testid="browser-reload" title="リロード">⟳</button>
        </div>
        <input class="urlInput" data-testid="browser-url-input" value="http://localhost:3000/dashboard" spellcheck="false">
        <button class="goBtn" data-testid="browser-go">Go</button>
        <span class="stateBadge running" data-testid="browser-state-badge"><span class="bdot"></span> running</span>
        <button class="stopBtn" data-testid="browser-stop">■ Stop</button>
      </div>

      <div class="viewportWrap">
        <div class="viewport full" data-testid="browser-viewport">
          <div class="fakePage">
            <div class="fakeTop">
              <div class="fakeLogo"></div>
              <div class="fakeNav"><span class="on">Dashboard</span><span>Projects</span><span>Settings</span></div>
            </div>
            <div class="fakeBody">
              <h1 class="fakeH">Build dashboard</h1>
              <p class="fakeSub">localhost:3000 — Claude が作っている dev サーバ（共有ブラウザを別タブでフル表示）</p>
              <div class="fakeCards">
                <div class="fakeCard"><div class="k">Passing</div><div class="v up">128</div></div>
                <div class="fakeCard"><div class="k">Coverage</div><div class="v">94%</div></div>
                <div class="fakeCard"><div class="k">Latency</div><div class="v">42ms</div></div>
              </div>
              <span class="fakeBtn">Run all tests</span>
            </div>
            <div class="fakeCursor"></div>
          </div>
        </div>

        <div class="claudeHint" data-testid="browser-claude-hint">
          <span class="liveDot"></span>
          <span><b style="color:var(--color-fg)">LIVE</b> · この別タブは palmux のタブと同じ1個のブラウザを共有しています（Claude の操作もここに反映）。</span>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
