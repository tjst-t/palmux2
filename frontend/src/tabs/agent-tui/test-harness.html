<!DOCTYPE html>
<!--
  claude-tui tab mock test harness.

  Loaded by tests/e2e/s7ce250_claude_tui_mock.py via file:// with
  query parameters:
    ?ws=ws://127.0.0.1:<port>          — WS endpoint override
    ?resize=http://127.0.0.1:<port>    — resize POST endpoint override

  Implements the same UI contract as claude-tui-tab.tsx:
    data-testid="claude-tui-status"      — status text
    data-testid="claude-tui-terminal"    — terminal host div
    data-testid="claude-tui-reconnect-btn" — reconnect button (visible only when disconnected)

  Status values mirror the component: connecting / connected / streaming / disconnected
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Claude TUI — test harness</title>
  <style>
    body { margin: 0; background: #0c0e14; color: #d4d4d8; font-family: monospace; }
    #wrap { display: flex; flex-direction: column; height: 100vh; }
    #status-bar { padding: 4px 8px; background: #13151c; border-bottom: 1px solid #1e2028; font-size: 11px; }
    #terminal { flex: 1; padding: 8px; overflow: hidden; }
    #overlay {
      display: none;
      position: fixed; inset: 0;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: rgba(15,17,23,0.75);
      font-size: 13px;
    }
    #overlay.visible { display: flex; }
    #reconnect-btn {
      padding: 6px 16px; background: #7c8aff; color: #fff;
      border: none; border-radius: 4px; font-size: 13px; cursor: pointer;
    }
  </style>
</head>
<body>
<div id="wrap">
  <div id="status-bar">
    <span data-testid="claude-tui-status" id="status">connecting</span>
  </div>
  <div data-testid="claude-tui-terminal" id="terminal"></div>
  <div id="overlay">
    <span>Disconnected</span>
    <button data-testid="claude-tui-reconnect-btn" id="reconnect-btn">Reconnect</button>
  </div>
</div>
<script>
  // --- Parse query params ---
  const params = new URLSearchParams(location.search);
  const wsUrl = params.get('ws') || 'ws://127.0.0.1:0/attach';
  const resizeUrl = params.get('resize') || null;

  const statusEl = document.getElementById('status');
  const overlay = document.getElementById('overlay');
  const reconnectBtn = document.getElementById('reconnect-btn');

  let ws = null;
  let streamingTimer = null;
  let resizeDebounce = null;

  const RESIZE_DEBOUNCE_MS = 200;

  function setStatus(s) {
    statusEl.textContent = s;
    if (s === 'disconnected') {
      overlay.classList.add('visible');
    } else {
      overlay.classList.remove('visible');
    }
  }

  function sendResizeNow(cols, rows) {
    if (!resizeUrl || cols <= 0 || rows <= 0) return;
    fetch(resizeUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cols, rows }),
    }).catch(() => {});
  }

  function connect() {
    setStatus('connecting');
    try {
      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';
    } catch {
      setStatus('disconnected');
      return;
    }

    ws.onopen = () => {
      setStatus('connected');
      // Announce current size.
      const cols = Math.floor(window.innerWidth / 8);
      const rows = Math.floor(window.innerHeight / 16);
      sendResizeNow(cols, rows);
    };

    ws.onmessage = () => {
      setStatus('streaming');
      if (streamingTimer) clearTimeout(streamingTimer);
      streamingTimer = setTimeout(() => {
        setStatus('connected');
      }, 1000);
    };

    ws.onclose = () => {
      ws = null;
      setStatus('disconnected');
    };

    ws.onerror = () => {
      // onclose fires right after onerror; just mark disconnected.
      setStatus('disconnected');
    };
  }

  // Resize observer → POST /resize (debounced, 200ms).
  const ro = new ResizeObserver(() => {
    if (resizeDebounce) clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(() => {
      const cols = Math.floor(window.innerWidth / 8);
      const rows = Math.floor(window.innerHeight / 16);
      sendResizeNow(cols, rows);
    }, RESIZE_DEBOUNCE_MS);
  });
  ro.observe(document.body);

  reconnectBtn.addEventListener('click', connect);

  // Initial connection.
  connect();
</script>
</body>
</html>
