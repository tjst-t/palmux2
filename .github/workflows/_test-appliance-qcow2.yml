name: _test-appliance-qcow2
# THROWAWAY workflow to verify `nix build .#appliance-qcow2` actually completes on
# a standard GitHub-hosted runner (KVM availability, disk space, build time) before
# wiring it into release.yml's real appliance-qcow2 job. Uploads a workflow
# artifact instead of a release asset — does not touch Releases. Delete this file
# (and the throwaway branch it lives on) once verified.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for /dev/kvm
        run: ls -la /dev/kvm || echo "NO /dev/kvm ON THIS RUNNER"

      - name: Disk space before
        run: df -h

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Build appliance qcow2
        run: |
          time nix build .#appliance-qcow2 --print-build-logs --no-link --print-out-paths \
            | tail -n1 > out-path.txt
          echo "OUT_PATH=$(cat out-path.txt)" >> "$GITHUB_ENV"

      - name: Disk space after
        run: df -h

      - name: List output dir
        run: |
          echo "OUT_PATH=$OUT_PATH"
          find "$OUT_PATH" -maxdepth 2 -exec ls -lh {} \;

      - name: Locate qcow2
        run: |
          IMG="$(find "$OUT_PATH" -maxdepth 1 -name '*.qcow2' | head -n1)"
          if [ -z "$IMG" ]; then
            RAW="$(find "$OUT_PATH" -maxdepth 1 \( -name '*.raw' -o -name '*.img' \) | head -n1)"
            test -n "$RAW" || { echo "::error::no .qcow2/.raw/.img file found under $OUT_PATH"; exit 1; }
            echo "no .qcow2, found raw image: $RAW — converting"
            sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils
            qemu-img convert -O qcow2 -c "$RAW" appliance-test.qcow2
          else
            cp "$IMG" appliance-test.qcow2
          fi
          ls -lh appliance-test.qcow2

      - uses: actions/upload-artifact@v4
        with:
          name: appliance-test-qcow2
          path: appliance-test.qcow2
          retention-days: 1
