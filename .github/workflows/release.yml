name: release

# Triggered by pushing a `v*` tag (e.g. v1.0.0, v0.2.0-rc1). Builds the
# linux/amd64 and linux/arm64 binaries with the embedded frontend and
# attaches them to a GitHub Release whose body is auto-generated from
# the commits since the previous tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build linux/amd64 + linux/arm64
        run: |
          make build-linux
          make build-arm

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bin/palmux-linux-amd64
            bin/palmux-linux-arm64

  # Attach the palmux-ws container image asset to the release.
  #
  # The image only changes when something under images/ changes (build.sh + its
  # sidecars). A binary-only release ships the SAME image content as the previous
  # release — but the self-update machinery ties the image's reported version to
  # the release tag, so the release still needs a palmux-ws.tar.gz carrying the
  # NEW version (else `palmux runtime install` finds no asset and the self-update
  # badge falsely lights "image 更新あり" forever).
  #
  # GitHub runners can't run incus, so we DON'T rebuild here. Instead
  # release-image.sh RE-STAMPS the previous release's image: it rewrites only the
  # version in the unified incus tarball (metadata.yaml + rootfs/etc/palmux-ws-version)
  # via member-level tar surgery — no apt, no incus — and re-attaches it.
  #
  # When images/ DID change since the previous image-bearing release, the script
  # exits 3 and this job FAILS with a ::error:: telling the maintainer to rebuild
  # palmux-ws on a VM (images/workspace-default/build.sh) and upload it. The
  # release's binaries are already published by the `release` job; this red job is
  # purely the "image needs a real rebuild" signal — it never ships a stale image.
  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          # Full history + all tags so release-image.sh can resolve the previous
          # image-bearing release tag and `git diff <prev>..HEAD -- images/`.
          fetch-depth: 0

      - name: Re-stamp previous image to ${{ github.ref_name }} (or require rebuild)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          scripts/release-image.sh "${{ github.ref_name }}" --upload

  # palmuxOS appliance qcow2 (Sb14caa). Built + attached to the release ONLY on
  # minor/major version bumps (patch == 0). A deployed appliance tracks the latest
  # patch via `nixos-rebuild switch` (generation swap, docs/nixos-appliance-design.md
  # Stage 4) after first boot, so the base qcow2 doesn't need to be rebaked on every
  # patch tag — this repo often ships many patch releases per week, and a fresh
  # ~800MB image + long disko/QEMU build on each one would be pure waste.
  #
  # disko's image builder runs an actual QEMU VM to partition/format/grub-install
  # (see docs/sprint-logs/S52fc2c/impl-nix.md), so this needs /dev/kvm on the
  # runner — confirmed available on standard GitHub-hosted ubuntu-latest runners
  # (verified 2026-07-13: a throwaway workflow_dispatch run built + converted the
  # image in 4m8s total). Non-blocking: an independent job off `release`, so if
  # KVM/disko/a flake input ever breaks, this job just goes red — the palmux2
  # binary release already succeeded — and the maintainer builds it manually
  # (`nix build .#appliance-qcow2`) and `gh release upload`s it.
  appliance-qcow2:
    needs: release
    runs-on: ubuntu-latest
    # Stable releases only (no -rc/-beta/-alpha), and only when the patch component
    # is 0 — i.e. this tag is a minor or major bump, not a patch release.
    if: >-
      !contains(github.ref_name, '-rc') &&
      !contains(github.ref_name, '-beta') &&
      !contains(github.ref_name, '-alpha') &&
      endsWith(github.ref_name, '.0')
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # nix/packages/palmux2.nix's committed defaultVersion always lags one
      # release behind: bump-nix-default (below) commits the bump to `main`
      # AFTER this tag is cut, so this tag's own tree can never see it — left
      # alone, `nix build .#appliance-qcow2` would bake the PREVIOUS release's
      # palmux2 binary into an image labeled with THIS release's tag. Patch
      # the checkout in-place (not committed) so the build is self-consistent
      # with its own tag. The `release` job (needs: release) has already
      # uploaded this tag's binaries, so their hashes are computable now.
      - name: Pin nix/packages/palmux2.nix to this release
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          echo "Computing sha256 for palmux-linux-amd64..."
          HEX_AMD64="$(curl -fsSL "${BASE_URL}/palmux-linux-amd64" | sha256sum | awk '{print $1}')"
          SRI_AMD64="sha256-$(printf '%s' "$HEX_AMD64" | xxd -r -p | base64 -w0)"

          echo "Computing sha256 for palmux-linux-arm64..."
          HEX_ARM64="$(curl -fsSL "${BASE_URL}/palmux-linux-arm64" | sha256sum | awk '{print $1}')"
          SRI_ARM64="sha256-$(printf '%s' "$HEX_ARM64" | xxd -r -p | base64 -w0)"

          NIX_FILE="nix/packages/palmux2.nix"
          sed -i "s|defaultVersion = \"[^\"]*\";|defaultVersion = \"${VERSION}\";|" "$NIX_FILE"
          sed -i "s|amd64 = \"sha256-[^\"]*\";|amd64 = \"${SRI_AMD64}\";|" "$NIX_FILE"
          sed -i "s|arm64 = \"sha256-[^\"]*\";|arm64 = \"${SRI_ARM64}\";|" "$NIX_FILE"

          echo "--- Pinned for this build ---"
          grep -E 'defaultVersion|amd64|arm64' "$NIX_FILE"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Build appliance qcow2
        run: |
          nix build .#appliance-qcow2 --print-build-logs --no-link --print-out-paths \
            | tail -n1 > out-path.txt
          echo "OUT_PATH=$(cat out-path.txt)" >> "$GITHUB_ENV"

      - name: Locate, convert + rename qcow2
        # disko's diskoImages output is a sparse main.raw, not a qcow2 (verified
        # 2026-07-13 by a throwaway CI run) — compress it with qemu-img the same
        # way the appliance image is built manually today (~810MB compressed from
        # a 17G sparse raw).
        run: |
          IMG="$(find "$OUT_PATH" -maxdepth 1 -name '*.qcow2' | head -n1)"
          if [ -z "$IMG" ]; then
            RAW="$(find "$OUT_PATH" -maxdepth 1 \( -name '*.raw' -o -name '*.img' \) | head -n1)"
            test -n "$RAW" || { echo "::error::no .qcow2/.raw/.img file found under $OUT_PATH"; exit 1; }
            sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils
            qemu-img convert -O qcow2 -c "$RAW" "palmuxos-${{ github.ref_name }}.qcow2"
          else
            cp "$IMG" "palmuxos-${{ github.ref_name }}.qcow2"
          fi
          ls -lh "palmuxos-${{ github.ref_name }}.qcow2"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "palmuxos-${{ github.ref_name }}.qcow2" \
            --repo "${{ github.repository }}" \
            --clobber

  # Bump the baked-in defaultVersion + defaultHashes in nix/packages/palmux2.nix
  # so that `install.sh` / `palmux runtime install` default to the just-released
  # stable version when no PALMUX_VERSION override is given.
  #
  # Flow:
  #   1. This job runs only for STABLE releases (no -rc/-beta/-alpha in the tag,
  #      and github.event.release.prerelease is false).  Pre-releases must NOT
  #      update the committed default — users who don't opt-in via PALMUX_WS_PRE=1
  #      should always get the last stable.
  #   2. We check out the tag (done by the `release` job's checkout), then fetch
  #      origin/main and check it out so we can commit back.  The `release` job
  #      already uploaded the assets, so by the time this job runs the assets are
  #      on GitHub and we can compute their sha256.
  #   3. sed-update defaultVersion + amd64/arm64 hashes → commit if changed →
  #      push to main.  Idempotent: if already current, `git diff --quiet` skips.
  bump-nix-default:
    needs: release
    runs-on: ubuntu-latest
    # Only run for stable releases: tag must not contain -rc, -beta, or -alpha.
    # github.event is not available on push triggers so we check the tag name.
    if: >-
      !contains(github.ref_name, '-rc') &&
      !contains(github.ref_name, '-beta') &&
      !contains(github.ref_name, '-alpha')
    steps:
      - name: Check out main branch
        # We need to push to main, not the tag.  Check out the tag first (via
        # the default behaviour of checkout@v6 with the push.tags trigger), then
        # fetch + switch to main so our commit lands on the right branch.
        uses: actions/checkout@v6
        with:
          # Use a token with write permission (the default GITHUB_TOKEN in this
          # workflow has `contents: write` from the top-level permissions block).
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch all branches so we can switch to main.
          fetch-depth: 0

      - name: Switch to main and pull latest
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Compute release asset hashes (SRI)
        id: hashes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          echo "Computing sha256 for palmux-linux-amd64..."
          HEX_AMD64="$(curl -fsSL "${BASE_URL}/palmux-linux-amd64" | sha256sum | awk '{print $1}')"
          SRI_AMD64="sha256-$(printf '%s' "$HEX_AMD64" | xxd -r -p | base64 -w0)"

          echo "Computing sha256 for palmux-linux-arm64..."
          HEX_ARM64="$(curl -fsSL "${BASE_URL}/palmux-linux-arm64" | sha256sum | awk '{print $1}')"
          SRI_ARM64="sha256-$(printf '%s' "$HEX_ARM64" | xxd -r -p | base64 -w0)"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sri_amd64=${SRI_AMD64}" >> "$GITHUB_OUTPUT"
          echo "sri_arm64=${SRI_ARM64}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "amd64: ${SRI_AMD64}"
          echo "arm64: ${SRI_ARM64}"

      - name: Update nix/packages/palmux2.nix
        env:
          VERSION: ${{ steps.hashes.outputs.version }}
          SRI_AMD64: ${{ steps.hashes.outputs.sri_amd64 }}
          SRI_ARM64: ${{ steps.hashes.outputs.sri_arm64 }}
        run: |
          NIX_FILE="nix/packages/palmux2.nix"

          # Update defaultVersion
          sed -i "s|defaultVersion = \"[^\"]*\";|defaultVersion = \"${VERSION}\";|" "$NIX_FILE"

          # Update amd64 hash — the line looks like:
          #   amd64 = "sha256-...";
          sed -i "s|amd64 = \"sha256-[^\"]*\";|amd64 = \"${SRI_AMD64}\";|" "$NIX_FILE"

          # Update arm64 hash
          sed -i "s|arm64 = \"sha256-[^\"]*\";|arm64 = \"${SRI_ARM64}\";|" "$NIX_FILE"

          echo "--- Updated content ---"
          grep -E 'defaultVersion|amd64|arm64' "$NIX_FILE"

      - name: Commit and push if changed
        env:
          VERSION: ${{ steps.hashes.outputs.version }}
          TAG: ${{ steps.hashes.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git diff --quiet nix/packages/palmux2.nix && {
            echo "nix/packages/palmux2.nix already up to date; nothing to commit."
            exit 0
          }

          git add nix/packages/palmux2.nix
          git commit -m "chore(nix): bump palmux2 default to ${TAG}

          Auto-updated by release.yml after stable release ${TAG}.
          Updates defaultVersion + defaultHashes (amd64/arm64) so that
          install.sh and \`palmux runtime install\` default to ${VERSION}
          without requiring PALMUX_VERSION to be set.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push origin main
